<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Repair-and-conjugate DNA catalyst workflow</title>
  <desc id="desc">A conceptual workflow showing uracil-containing DNA, enzymatic base excision, aldehyde formation, bioorthogonal catalyst attachment, and library screening.</desc>
  <rect width="1400" height="760" fill="#f3f7fb"/>
  <text x="72" y="78" fill="#7f8790" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="2">CONCEPTUAL METHOD MAP · NOT A PUBLISHED FIGURE</text>
  <text x="72" y="132" fill="#13213a" font-family="Newsreader, Georgia, serif" font-size="42">Repair creates the handle; conjugation creates the library</text>
  <g font-family="IBM Plex Mono, monospace" font-size="17" fill="#7f8790">
    <text x="83" y="214">01 · ENCODE</text><text x="386" y="214">02 · EXCISE</text><text x="698" y="214">03 · CONJUGATE</text><text x="1036" y="214">04 · SCREEN</text>
  </g>
